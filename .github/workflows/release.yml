name: Portable release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            target_name: AnimeBox-Windows-x64
          - os: ubuntu-latest
            name: Linux-x64
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            target_name: AnimeBox-Linux-x64
          - os: macos-15-intel
            name: macOS-x64
            ffmpeg_url: system
            target_name: AnimeBox-macOS-x64
          - os: macos-14
            name: macOS-arm64
            ffmpeg_url: system
            target_name: AnimeBox-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checkout anicli-api
        shell: bash
        run: |
          git clone --depth 1 https://github.com/vypivshiy/anicli-api .references/anicli-api
          python scripts/patch_anicli.py

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r release/requirements-build.txt

      - name: Download ffmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 '${{ matrix.ffmpeg_url }}' --output ffmpeg.tar.xz
          mkdir ffmpeg-package
          tar -xJf ffmpeg.tar.xz -C ffmpeg-package --strip-components=1
          ffmpeg=$(find ffmpeg-package -type f -path '*/bin/ffmpeg' -print -quit)
          test -n "$ffmpeg"
          echo "FFMPEG_PATH=$(realpath "$ffmpeg")" >> "$GITHUB_ENV"

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = '${{ matrix.ffmpeg_url }}'
          $curlArgs = @(
            '--fail', '--location',
            '--retry', '5', '--retry-delay', '5', '--retry-all-errors',
            '--connect-timeout', '30', '--max-time', '600'
          )

          & curl.exe @curlArgs --output ffmpeg.zip $url
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed with curl exit code ${LASTEXITCODE}: $url" }

          $archive = Get-Item ffmpeg.zip -ErrorAction Stop
          if ($archive.Length -le 0) { throw 'downloaded ffmpeg archive is empty' }
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ffmpeg archive: $($archive.Length) bytes, SHA-256 $actual"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $ffmpegEntry = $zip.Entries | Where-Object { $_.FullName -match '(^|/)bin/ffmpeg\.exe$' } | Select-Object -First 1
            if (-not $ffmpegEntry) { throw 'ffmpeg archive does not contain bin/ffmpeg.exe' }
          } finally {
            $zip.Dispose()
          }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]ffmpeg\.exe$' } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found after archive extraction' }
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg executable check failed with exit code $LASTEXITCODE" }
          "FFMPEG_PATH=$($ffmpeg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Locate native ffmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Build portable archive
        run: python release/build_portable.py --ffmpeg "${{ env.FFMPEG_PATH }}" --target-name "${{ matrix.target_name }}"

      - name: Verify packaged ffmpeg
        shell: bash
        run: |
          ffmpeg="release/artifacts/${{ matrix.target_name }}/tools/ffmpeg"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ffmpeg="${ffmpeg}.exe"
          fi
          test -x "$ffmpeg" || [[ "${{ runner.os }}" == "Windows" ]]
          "$ffmpeg" -version
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            while IFS= read -r binary; do
              echo "Checking $binary"
              otool -L "$binary"
              if otool -L "$binary" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)'; then
                echo "Packaged FFmpeg retains Homebrew load paths: $binary" >&2
                exit 1
              fi
              codesign --verify --strict "$binary"
            done < <(find "$(dirname "$ffmpeg")" -type f \( -name ffmpeg -o -name '*.dylib' \))
          fi

      - name: Smoke test packaged server
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, platform, subprocess, time, urllib.request
          artifacts = pathlib.Path('release/artifacts')
          folder = next(p for p in artifacts.iterdir() if p.is_dir() and p.name.startswith('AnimeBox-'))
          exe = (folder / ('AnimeBox.exe' if platform.system() == 'Windows' else 'AnimeBox')).resolve()
          env = dict(os.environ)
          env['PATH'] = str((folder / 'tools').resolve()) + os.pathsep + env.get('PATH', '')
          launch_cwd = pathlib.Path('release/smoke-cwd').resolve()
          launch_cwd.mkdir(parents=True, exist_ok=True)
          proc = subprocess.Popen(
              [str(exe)],
              cwd=str(launch_cwd),
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              for _ in range(120):
                  if proc.poll() is not None:
                      output = proc.stdout.read() if proc.stdout else ''
                      raise SystemExit(f'portable app exited with {proc.returncode}:\n{output}')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=1) as response:
                          if response.status == 200:
                              print('portable health: OK')
                              break
                  except OSError:
                      time.sleep(.25)
              else:
                  output = proc.stdout.read() if proc.poll() is not None and proc.stdout else ''
                  raise SystemExit(f'portable app failed health check:\n{output}')
              if not (folder / 'data' / 'animebox.db').is_file():
                  raise SystemExit('portable database was not created inside package data directory')
              with urllib.request.urlopen('http://127.0.0.1:8787/api/sources', timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit(f'portable sources check returned HTTP {response.status}')
              with urllib.request.urlopen('http://127.0.0.1:8787/api/search?q=k-on&source=animego', timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f'portable search check returned HTTP {response.status}')
              if (launch_cwd / 'data').exists() or (launch_cwd / 'library').exists():
                  raise SystemExit('portable runtime files leaked into launch working directory')
              with urllib.request.urlopen('http://127.0.0.1:8787/api/session', timeout=5) as response:
                  token = __import__('json').load(response)['shutdown_token']
              request = urllib.request.Request(
                  'http://127.0.0.1:8787/api/shutdown',
                  method='POST',
                  headers={'X-AnimeBox-Token': token},
              )
              with urllib.request.urlopen(request, timeout=5) as response:
                  if response.status != 200:
                      raise SystemExit(f'portable shutdown returned HTTP {response.status}')
              proc.wait(timeout=15)
              if proc.returncode != 0:
                  output = proc.stdout.read() if proc.stdout else ''
                  raise SystemExit(f'portable shutdown exited with {proc.returncode}:\n{output}')
              with __import__('socket').socket() as sock:
                  if sock.connect_ex(('127.0.0.1', 8787)) == 0:
                      raise SystemExit('portable shutdown did not release port 8787')
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try: proc.wait(timeout=10)
                  except subprocess.TimeoutExpired: proc.kill()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeBox-${{ matrix.name }}
          path: |
            release/artifacts/*.zip
            release/artifacts/*.tar.gz
            release/artifacts/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build checksum manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz 2>/dev/null > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
