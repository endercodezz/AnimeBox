name: Portable release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            ffmpeg_url: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          - os: ubuntu-latest
            name: Linux-x64
            ffmpeg_url: system
          - os: macos-13
            name: macOS-x64
            ffmpeg_url: system
          - os: macos-14
            name: macOS-arm64
            ffmpeg_url: system
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checkout anicli-api
        shell: bash
        run: git clone --depth 1 https://github.com/vypivshiy/anicli-api .references/anicli-api

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r release/requirements-build.txt

      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest '${{ matrix.ffmpeg_url }}' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found in downloaded archive' }
          "FFMPEG_PATH=$($ffmpeg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Locate native ffmpeg
        if: runner.os != 'Windows'
        shell: bash
        run: echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Build portable archive
        run: python release/build_portable.py --ffmpeg "${{ env.FFMPEG_PATH }}"

      - name: Smoke test packaged server
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, platform, subprocess, time, urllib.request
          artifacts = pathlib.Path('release/artifacts')
          folder = next(p for p in artifacts.iterdir() if p.is_dir() and p.name.startswith('AnimeBox-'))
          exe = folder / ('AnimeBox.exe' if platform.system() == 'Windows' else 'AnimeBox')
          env = dict(os.environ)
          env['PATH'] = str(folder / 'tools')
          proc = subprocess.Popen([str(exe)], cwd=folder, env=env)
          try:
              for _ in range(120):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=1) as response:
                          if response.status == 200:
                              print('portable health: OK')
                              break
                  except OSError:
                      time.sleep(.25)
              else:
                  raise SystemExit('portable app failed health check')
          finally:
              proc.terminate()
              try: proc.wait(timeout=10)
              except subprocess.TimeoutExpired: proc.kill()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeBox-${{ matrix.name }}
          path: |
            release/artifacts/*.zip
            release/artifacts/*.tar.gz
            release/artifacts/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build checksum manifest
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz 2>/dev/null > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
