name: Portable release

# Tags vX.Y.Z publish a release; vX.Y.Z-suffix (e.g. v2.0.0-beta.1) publish a prerelease.
# Manual runs (workflow_dispatch) build and test every platform and upload workflow artifacts only.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  meta:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        env:
          CODE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          version="$CODE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$version" ]]; then
              echo "Tag v$tag does not match backend.__version__ $version" >&2
              exit 1
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version $version is not semver" >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          - os: ubuntu-22.04 # older glibc keeps the Linux build compatible with SteamOS and most distributions
            platform: Linux-x64
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          - os: macos-15-intel
            platform: macOS-x64
            ffmpeg_url: system
          - os: macos-14
            platform: macOS-arm64
            ffmpeg_url: system
    runs-on: ${{ matrix.os }}
    env:
      TARGET_NAME: AnimeBox-${{ needs.meta.outputs.version }}-${{ matrix.platform }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch pinned anicli-api and apply compatibility patch
        run: python scripts/patch_anicli.py --checkout

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r release/requirements-build.txt

      - name: Download ffmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 '${{ matrix.ffmpeg_url }}' --output ffmpeg.tar.xz
          mkdir ffmpeg-package
          tar -xJf ffmpeg.tar.xz -C ffmpeg-package --strip-components=1
          ffmpeg=$(find ffmpeg-package -type f -path '*/bin/ffmpeg' -print -quit)
          test -n "$ffmpeg"
          echo "FFMPEG_PATH=$(realpath "$ffmpeg")" >> "$GITHUB_ENV"

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = '${{ matrix.ffmpeg_url }}'
          $curlArgs = @(
            '--fail', '--location',
            '--retry', '5', '--retry-delay', '5', '--retry-all-errors',
            '--connect-timeout', '30', '--max-time', '600'
          )
          & curl.exe @curlArgs --output ffmpeg.zip $url
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed with curl exit code ${LASTEXITCODE}: $url" }
          $archive = Get-Item ffmpeg.zip -ErrorAction Stop
          if ($archive.Length -le 0) { throw 'downloaded ffmpeg archive is empty' }
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ffmpeg archive: $($archive.Length) bytes, SHA-256 $actual"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]ffmpeg\.exe$' } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found after archive extraction' }
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg executable check failed with exit code $LASTEXITCODE" }
          "FFMPEG_PATH=$($ffmpeg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Locate native ffmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Build portable archive
        run: python release/build_portable.py --ffmpeg "${{ env.FFMPEG_PATH }}" --version "${{ env.VERSION }}" --target-name "${{ env.TARGET_NAME }}"

      - name: Verify archive contents and checksum
        shell: bash
        run: |
          archive=$(ls release/artifacts/"$TARGET_NAME".zip release/artifacts/"$TARGET_NAME".tar.gz 2>/dev/null)
          test -n "$archive"
          python release/verify_archive.py "$archive" --version "$VERSION"

      - name: Verify packaged ffmpeg
        shell: bash
        run: |
          ffmpeg="release/artifacts/$TARGET_NAME/tools/ffmpeg"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ffmpeg="${ffmpeg}.exe"
          fi
          test -x "$ffmpeg" || [[ "${{ runner.os }}" == "Windows" ]]
          "$ffmpeg" -version
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            while IFS= read -r binary; do
              echo "Checking $binary"
              otool -L "$binary"
              if otool -L "$binary" | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)'; then
                echo "Packaged FFmpeg retains Homebrew load paths: $binary" >&2
                exit 1
              fi
              codesign --verify --strict "$binary"
            done < <(find "$(dirname "$ffmpeg")" -type f \( -name ffmpeg -o -name '*.dylib' \))
          fi

      - name: Verify macOS permission helper from archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="release/artifacts/$TARGET_NAME.zip"
          extract_dir="$RUNNER_TEMP/animebox-permission-test"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          ditto -x -k "$archive" "$extract_dir"
          portable="$extract_dir/$TARGET_NAME"
          test -f "$portable/scripts/grant-macos-permissions.sh"
          chmod a-x "$portable/AnimeBox" "$portable/tools/ffmpeg"
          bash "$portable/scripts/grant-macos-permissions.sh" "$portable"
          test -x "$portable/AnimeBox"
          test -x "$portable/tools/ffmpeg"
          "$portable/tools/ffmpeg" -version

      - name: Smoke test packaged app
        shell: bash
        env:
          ANIMEBOX_NO_BROWSER: '1'
        run: |
          python - <<'PY'
          import json, os, pathlib, platform, socket, subprocess, time, urllib.error, urllib.request
          name = os.environ['TARGET_NAME']
          version = os.environ['VERSION']
          folder = pathlib.Path('release/artifacts') / name
          exe = (folder / ('AnimeBox.exe' if platform.system() == 'Windows' else 'AnimeBox')).resolve()
          launch_cwd = pathlib.Path('release/smoke-cwd').resolve()
          launch_cwd.mkdir(parents=True, exist_ok=True)
          base = 'http://127.0.0.1:8787'

          def get(path, timeout=10, headers=None):
              request = urllib.request.Request(base + path, headers=headers or {})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.status, response.read()

          proc = subprocess.Popen([str(exe)], cwd=str(launch_cwd), stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              for _ in range(160):
                  if proc.poll() is not None:
                      raise SystemExit(f'portable app exited with {proc.returncode}:\n{proc.stdout.read()}')
                  try:
                      status, body = get('/api/health', timeout=1)
                      if status == 200:
                          break
                  except OSError:
                      time.sleep(0.25)
              else:
                  raise SystemExit('portable app failed health check')
              health = json.loads(body)
              assert health['version'] == version, health
              status, html = get('/')
              assert status == 200 and b'<div id="root">' in html, 'bundled UI missing'
              status, body = get('/api/providers')
              assert status == 200 and json.loads(body)[0]['id'] == 'animego'
              status, body = get('/api/library')
              assert status == 200 and json.loads(body) == [], 'fresh install must have an empty library'
              status, body = get('/api/home')
              assert status == 200
              diagnostics = json.loads(get('/api/diagnostics')[1])
              assert diagnostics['ffmpeg']['path'], 'bundled ffmpeg not detected'
              try:
                  get('/api/health', headers={'Host': 'attacker.example'})
                  raise SystemExit('foreign Host header was accepted')
              except urllib.error.HTTPError as exc:
                  assert exc.code == 400
              if not (folder / 'data' / 'animebox.db').is_file():
                  raise SystemExit('database was not created inside the portable data directory')
              if (launch_cwd / 'data').exists() or (launch_cwd / 'library').exists():
                  raise SystemExit('runtime files leaked into the launch working directory')
              token = json.loads(get('/api/session')[1])['shutdown_token']
              request = urllib.request.Request(base + '/api/shutdown', method='POST', headers={'X-AnimeBox-Token': token})
              with urllib.request.urlopen(request, timeout=5) as response:
                  assert response.status == 200
              proc.wait(timeout=20)
              if proc.returncode != 0:
                  raise SystemExit(f'portable shutdown exited with {proc.returncode}:\n{proc.stdout.read()}')
              with socket.socket() as sock:
                  if sock.connect_ex(('127.0.0.1', 8787)) == 0:
                      raise SystemExit('portable shutdown did not release port 8787')
              if (folder / 'data' / 'animebox.db-wal').exists():
                  raise SystemExit('database WAL was not checkpointed on shutdown')
              print('portable smoke test: OK')
          finally:
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill()
          PY

      - name: Live provider check (informational)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from backend.providers.registry import ProviderRegistry
          async def main():
              registry = ProviderRegistry()
              await registry.check('animego')
              for stage, result in registry.health.get('animego').stages.items():
                  print(f"{stage:10} {'ok' if result.ok else 'FAIL'} {result.latency_ms} ms {result.error or ''}")
              await registry.aclose()
          asyncio.run(main())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_NAME }}
          path: |
            release/artifacts/*.zip
            release/artifacts/*.tar.gz
            release/artifacts/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify all platform archives and build checksum manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd artifacts
          expected="AnimeBox-$VERSION-Windows-x64.zip AnimeBox-$VERSION-Linux-x64.tar.gz AnimeBox-$VERSION-macOS-x64.zip AnimeBox-$VERSION-macOS-arm64.zip"
          for file in $expected; do
            test -s "$file" || { echo "missing $file — refusing to publish an incomplete release" >&2; exit 1; }
          done
          for file in *.sha256; do sha256sum -c "$file"; done
          sha256sum $expected > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python ../release/verify_archive.py $expected --version "$VERSION"

      - name: Release notes
        run: python release/release_notes.py "${{ needs.meta.outputs.version }}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: AnimeBox ${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
